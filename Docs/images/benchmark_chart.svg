<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Compression ratio comparison chart: xz -9 4.04x, AntiMatter max_compression 3.33x, bzip2 -9 3.11x, AntiMatter balanced 2.72x, zip -9 2.67x, gzip -9 2.67x, on a 470MB real-world mixed-content sample.">
  <style>
    .viz-root { color-scheme: light; }
    .surface   { fill: #fcfcfb; }
    .title     { fill: #0b0b0b; font: 600 17px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .subtitle  { fill: #52514e; font: 400 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label     { fill: #0b0b0b; font: 500 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .value     { fill: #0b0b0b; font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .legend    { fill: #52514e; font: 500 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .gridline  { stroke: #e3e2dc; stroke-width: 1; }
    .axislabel { fill: #86847c; font: 400 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bar-am    { fill: #2a78d6; }
    .bar-ind   { fill: #eb6834; }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) .surface   { fill: #1a1a19; }
      :root:where(:not([data-theme="light"])) .title     { fill: #ffffff; }
      :root:where(:not([data-theme="light"])) .subtitle  { fill: #c3c2b7; }
      :root:where(:not([data-theme="light"])) .label     { fill: #ffffff; }
      :root:where(:not([data-theme="light"])) .value     { fill: #ffffff; }
      :root:where(:not([data-theme="light"])) .legend    { fill: #c3c2b7; }
      :root:where(:not([data-theme="light"])) .gridline  { stroke: #33322f; }
      :root:where(:not([data-theme="light"])) .axislabel { fill: #86847c; }
      :root:where(:not([data-theme="light"])) .bar-am    { fill: #3987e5; }
      :root:where(:not([data-theme="light"])) .bar-ind   { fill: #d95926; }
    }
  </style>

  <rect class="surface" x="0" y="0" width="860" height="400" rx="10"/>

  <text class="title" x="28" y="34">Compression ratio — AntiMatter vs. industry-standard tools</text>
  <text class="subtitle" x="28" y="53">470 MB real-world mixed sample (numeric arrays, point clouds, JPEGs, logs) · higher is better</text>

  <!-- legend -->
  <rect x="580" y="24" width="12" height="12" rx="3" class="bar-am"/>
  <text class="legend" x="598" y="34">AntiMatter</text>
  <rect x="700" y="24" width="12" height="12" rx="3" class="bar-ind"/>
  <text class="legend" x="718" y="34">Industry tool</text>

  <!-- gridlines + axis (0x to 4.5x) -->
  <g>
    <line class="gridline" x1="220" y1="80"  x2="220" y2="358"/>
    <line class="gridline" x1="340" y1="80"  x2="340" y2="358"/>
    <line class="gridline" x1="460" y1="80"  x2="460" y2="358"/>
    <line class="gridline" x1="580" y1="80"  x2="580" y2="358"/>
    <line class="gridline" x1="700" y1="80"  x2="700" y2="358"/>
    <line class="gridline" x1="820" y1="80"  x2="820" y2="358"/>
    <text class="axislabel" x="220" y="374" text-anchor="middle">0x</text>
    <text class="axislabel" x="340" y="374" text-anchor="middle">1x</text>
    <text class="axislabel" x="460" y="374" text-anchor="middle">2x</text>
    <text class="axislabel" x="580" y="374" text-anchor="middle">3x</text>
    <text class="axislabel" x="700" y="374" text-anchor="middle">4x</text>
    <text class="axislabel" x="820" y="374" text-anchor="middle">5x</text>
  </g>

  <!-- bars: baseline x=220, scale 120px per 1.0x -->
  <!-- xz -9  : 4.04x -->
  <text class="label" x="28" y="99"  text-anchor="start">xz -9</text>
  <rect class="bar-ind" x="220" y="86"  width="484.8" height="20" rx="4"/>
  <text class="value" x="712" y="100">4.04x</text>

  <!-- AntiMatter max_compression : 3.33x -->
  <text class="label" x="28" y="145" text-anchor="start">AntiMatter (max)</text>
  <rect class="bar-am" x="220" y="132" width="399.6" height="20" rx="4"/>
  <text class="value" x="627" y="146">3.33x</text>

  <!-- bzip2 -9 : 3.11x -->
  <text class="label" x="28" y="191" text-anchor="start">bzip2 -9</text>
  <rect class="bar-ind" x="220" y="178" width="373.2" height="20" rx="4"/>
  <text class="value" x="601" y="192">3.11x</text>

  <!-- AntiMatter balanced : 2.72x -->
  <text class="label" x="28" y="237" text-anchor="start">AntiMatter (default)</text>
  <rect class="bar-am" x="220" y="224" width="326.4" height="20" rx="4"/>
  <text class="value" x="554" y="238">2.72x</text>

  <!-- zip -9 : 2.67x -->
  <text class="label" x="28" y="283" text-anchor="start">zip -9</text>
  <rect class="bar-ind" x="220" y="270" width="320.4" height="20" rx="4"/>
  <text class="value" x="548" y="284">2.67x</text>

  <!-- gzip -9 : 2.67x -->
  <text class="label" x="28" y="329" text-anchor="start">gzip -9</text>
  <rect class="bar-ind" x="220" y="316" width="320.4" height="20" rx="4"/>
  <text class="value" x="548" y="330">2.67x</text>

  <text class="axislabel" x="28" y="392">AntiMatter's default "balanced" mode ran in 44s · max_compression in 13.6 min · xz -9 took 8.4 min for its extra ratio</text>
</svg>
